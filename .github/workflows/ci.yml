name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, typecheck, unit and replay tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Integration tests skip themselves here: no engines are installed in this job.
      - run: npm test
      - run: npm run build

  engines:
    name: Integration tests with real CBMC, ESBMC and solvers
    runs-on: ubuntu-24.04
    env:
      ESBMC_VERSION: '8.5'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install CBMC, Z3 and cvc5
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cbmc z3 cvc5
      - name: Install ESBMC ${{ env.ESBMC_VERSION }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/esbmc.zip" "https://github.com/esbmc/esbmc/releases/download/v${ESBMC_VERSION}/esbmc-linux.zip"
          sudo mkdir -p /opt/esbmc
          sudo unzip -q "$RUNNER_TEMP/esbmc.zip" -d /opt/esbmc
          sudo ln -sf /opt/esbmc/release/bin/esbmc /usr/local/bin/esbmc
          esbmc --version
      - run: npm ci
      - name: Integration tests (missing tools fail instead of skipping)
        run: npx vitest run packages/core/test/integration.test.ts packages/core/test/cfs-examples.test.ts
        env:
          VERIFIER_REQUIRE: cbmc,esbmc,z3,cbmc:z3,cbmc:cvc5,goto-tools

  docker:
    name: Docker image verifies the sample end to end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t verifier-workbench .
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Smoke test
        run: |
          # A scripted stand-in for a self-hosted model, so the repair loop runs without an API key.
          node packages/server/test/fake-model.mjs packages/core/test/fixtures/c/arith.c 4011 &
          # Host networking reaches the fake model; the hardening flags are the ones the Dockerfile recommends.
          docker run -d --name vw --network host --read-only --tmpfs /tmp --cap-drop ALL --pids-limit 512 \
            -e LLM_PROVIDER=custom -e LLM_BASE_URL=http://127.0.0.1:4011/v1 verifier-workbench
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:3000/api/engines | jq -e '.engines.cbmc.available and .engines.esbmc.available'
          code=$(jq -Rs . < packages/core/test/fixtures/c/arith.c)
          for engine in cbmc esbmc; do
            curl -fsS -X POST http://127.0.0.1:3000/api/verify -H 'content-type: application/json' \
              -d "{\"code\": $code, \"fileName\": \"arith.c\", \"engine\": \"$engine\"}" -o "verify-$engine.json"
            if ! jq -e '.status == "refuted" and .counts.refuted == 2' "verify-$engine.json" > /dev/null; then
              echo "::error::$engine did not refute both bugs in the sample"
              jq '{status, counts, error, diagnostics, raw}' "verify-$engine.json"
              exit 1
            fi
            jq -c '{engine, status, counts, solver: .solver.label}' "verify-$engine.json"
          done
          # The web app at /, under its CSP; the design prototype stays reachable.
          curl -fsS -D headers.txt http://127.0.0.1:3000/runs/1 | grep -q '<div id="root"></div>'
          grep -qi "^content-security-policy: default-src 'self'" headers.txt
          curl -fsS http://127.0.0.1:3000/prototype | grep -q 'window.verifier = {'
          curl -fsS -X POST http://127.0.0.1:3000/api/repair -H 'content-type: application/json' \
            -d "{\"code\": $code, \"fileName\": \"arith.c\"}" -o repair.json
          if ! jq -e '.status == "repaired"
              and ([.iterations[] | (.rejection.guard // .outcome)] == ["baseline", "behavior", "accepted"])
              and ([.equivalence[].status] | all(. == "equivalent"))' repair.json > /dev/null; then
            echo "::error::the repair loop did not reject the gutted patch and accept the honest fix"
            jq '{status, error, iterations: [.iterations[] | {iter, outcome, rejection, error}], equivalence}' repair.json
            exit 1
          fi
          jq -c '{status, outcomes: [.iterations[] | (.rejection.guard // .outcome)], equivalence: [.equivalence[] | [.function, .status]]}' repair.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser end to end (New Run → Workbench → Repair → Diff → Report, then demo mode)
        run: |
          # A fresh stand-in model, so it answers with the gutted patch first again.
          pkill -f fake-model.mjs || true
          node packages/server/test/fake-model.mjs packages/core/test/fixtures/c/arith.c 4011 &
          sleep 1
          BASE_URL=http://127.0.0.1:3000 npm run e2e
      - name: Container logs
        if: always()
        run: docker logs vw || true
