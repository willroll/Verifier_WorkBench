name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, typecheck, unit and replay tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Integration tests skip themselves here: no engines are installed in this job.
      - run: npm test
      - run: npm run build

  engines:
    name: Integration tests with real CBMC, ESBMC and solvers
    runs-on: ubuntu-24.04
    env:
      ESBMC_VERSION: '8.5'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install CBMC, Z3 and cvc5
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cbmc z3 cvc5
      - name: Install ESBMC ${{ env.ESBMC_VERSION }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/esbmc.zip" "https://github.com/esbmc/esbmc/releases/download/v${ESBMC_VERSION}/esbmc-linux.zip"
          sudo mkdir -p /opt/esbmc
          sudo unzip -q "$RUNNER_TEMP/esbmc.zip" -d /opt/esbmc
          sudo ln -sf /opt/esbmc/release/bin/esbmc /usr/local/bin/esbmc
          esbmc --version
      - run: npm ci
      - name: Integration tests (missing tools fail instead of skipping)
        run: npx vitest run packages/core/test/integration.test.ts
        env:
          VERIFIER_REQUIRE: cbmc,esbmc,z3,cbmc:z3,cbmc:cvc5

  docker:
    name: Docker image verifies the sample end to end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t verifier-workbench .
      - name: Smoke test
        run: |
          docker run -d --name vw -p 3000:3000 verifier-workbench
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:3000/api/engines | jq -e '.engines.cbmc.available and .engines.esbmc.available'
          code=$(jq -Rs . < packages/core/test/fixtures/c/arith.c)
          for engine in cbmc esbmc; do
            curl -fsS -X POST http://127.0.0.1:3000/api/verify -H 'content-type: application/json' \
              -d "{\"code\": $code, \"fileName\": \"arith.c\", \"engine\": \"$engine\"}" \
              | jq -e '.status == "refuted" and .counts.refuted == 2'
          done
          curl -fsS http://127.0.0.1:3000/ | grep -q 'window.verifier = {'
      - name: Container logs
        if: always()
        run: docker logs vw || true
